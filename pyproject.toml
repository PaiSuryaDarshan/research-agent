[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "research_agent"
version = "0.1.0"
description = "A science research agent for reviews with traceable citations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx==0.28.1",
    "pydantic==2.14.4",
    "python-dotenv==1.2.4",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[project.scripts]
research-agent = "research_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ['tests']
